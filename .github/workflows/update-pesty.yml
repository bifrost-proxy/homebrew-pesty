name: Update Pesty Cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pesty-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download and validate the latest Cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          downloaded_cask="$(mktemp)"
          gh release download \
            --repo bifrost-proxy/pesty \
            --pattern pesty.rb \
            --output "$downloaded_cask" \
            --clobber
          ruby -c "$downloaded_cask"
          grep -Fq 'homepage "https://github.com/bifrost-proxy/pesty"' "$downloaded_cask"
          install -m 0644 "$downloaded_cask" Casks/pesty.rb

      - name: Publish an updated Cask
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/pesty.rb; then
            echo "The Tap already contains the latest Pesty Cask."
            exit 0
          fi
          version="$(sed -nE 's/^  version "([^"]+)"/\1/p' Casks/pesty.rb)"
          test -n "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pesty.rb
          git commit -m "Update Pesty to ${version}"
          git push
